[project]
name = "progetto-finale-coding-ai"
version = "0.1.0"
description = ""
authors = [
    {name = "Luca Bozzali",email = "“lucathebozza@gmail.com”"}
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi (>=0.139.2,<0.140.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "openai (>=2.48.0,<3.0.0)",
    "langchain-openai (>=1.4.1,<2.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "langgraph (>=1.2.9,<2.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "google-search-results (>=2.4.2,<3.0.0)",
    "langchain (>=1.3.14,<2.0.0)"
]

[tool.poetry]
packages = [{include = "progetto_finale_coding_ai", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
